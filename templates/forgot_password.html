{% extends "base.html" %}

{% block title %}Wachtwoord vergeten - Sponsoring De Kampanje{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">
                        <i class="fas fa-key text-primary me-2"></i>
                        Wachtwoord vergeten
                    </h2>
                    <p class="text-muted">Vul je e-mailadres in om een herstelcode te ontvangen</p>
                </div>
                
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mailadres</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="naam@dekampanje.be">
                        <div class="form-text">
                            We sturen je een 6-digit code die 30 minuten geldig is.
                        </div>
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-2"></i>
                            Code verzenden
                        </button>
                    </div>
                    
                    <div class="text-center">
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-muted">
                            <i class="fas fa-arrow-left me-1"></i> Terug naar inloggen
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
